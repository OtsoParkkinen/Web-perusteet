<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröidy - Keskitalo</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <!-- Ylävalikko: Täysin sama järjestjestys ja nimet kuin etusivulla -->
    <header>
        <div class="logo"></div>

        <nav>
            <a href="index.html#etusivu">Etusivu</a>
            <a href="index.html#tietoa">Tietoa</a>
            <a href="index.html#yhteys">Yhteys</a>
            <a href="gallery.html">Gallery</a>
            <a href="register.html" class="active">Rekisteröidy</a>
        </nav>
    </header>

    <main class="register-container">
        <h1>Rekisteröidy käyttäjäksi</h1>
        
        <!-- Rekisteröitymislomake vaatimusten mukaisesti -->
        <form action="https://httpbin.org/post" method="post" class="registration-form">
            
            <!-- Nimi -->
            <div class="form-group">
                <label for="name">Nimi *</label>
                <input type="text" id="name" name="name" required placeholder="Etunimi Sukunimi">
            </div>

            <!-- Sähköpostiosoite -->
            <div class="form-group">
                <label for="email">Sähköpostiosoite *</label>
                <input type="email" id="email" name="email" required placeholder="esimerkki@gmail.fi">
            </div>

            <!-- Käyttäjänimi (vähintään 3 merkkiä) -->
            <div class="form-group">
                <label for="username">Käyttäjänimi *</label>
                <input type="text" id="username" name="username" required minlength="3" placeholder="Vähintään 3 merkkiä">
            </div>

            <!-- Salasana (vähintään 8 merkkiä) -->
            <div class="form-group">
                <label for="password">Salasana *</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="Vähintään 8 merkkiä">
            </div>

            <!-- Käyttäjätyyppi (3 aiheeseen sopivaa vaihtoehtoa Keskitalolle) -->
            <div class="form-group">
                <label for="user_type">Käyttäjätyyppi *</label>
                <select id="user_type" name="user_type" required>
                    <option value="" disabled selected>Valitse käyttäjätyyppi...</option>
                    <option value="perheenjasen">Perheenjäsen</option>
                    <option value="vieras">Vieras / Mökkiläinen</option>
                    <option value="yllapitaja">Ylläpitäjä</option>
                </select>
            </div>

            <!-- Käyttöehtojen hyväksyminen (checkbox) -->
            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Hyväksyn <a href="#" target="_blank">käyttöehdot</a> *</label>
            </div>

            <!-- Register-lähetyspainike, hyödyntää olemassa olevaa .button-tyyliä -->
            <button type="submit" class="button">Rekisteröidy</button>
        </form>
    </main>

    <footer id="yhteys">
        <p>Ota yhteyttä: otso.a.parkkinen@gmail.fi</p>
        <p>© 2026 Keskitalon verkkosivu</p>
    </footer>

</body>
</html>
